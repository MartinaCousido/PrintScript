name: CD

# Publica el commit exacto que pasó CI después de cada push o merge a main/master.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar los paquetes
    permissions:
      contents: read
      packages: write
    if: >-
      ${{ github.event_name == 'push' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.commit.outputs.commit }}
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 por la misma razón que en el CI: el ratchet de Spotless compara
      # contra origin/master y necesita la historia completa.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Registrar el commit publicado
        id: commit
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instalar el JDK del toolchain declarado
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derivar la versión
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            version="0.2.0-main.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[[:alnum:].]+)?$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No se publica nada que no pase los mismos chequeos que el CI. Un tag sobre un
      # commit roto tiene que fallar acá y no quedar publicado a medias.
      - name: Verificar antes de publicar
        run: ./gradlew build -PprintscriptVersion=$VERSION --no-daemon --warning-mode all

      - name: Ejecutar el TCK oficial antes de publicar
        run: ./tck/run-official-tck.sh "$VERSION"

      # Los trece módulos, cada uno con su jar, su jar de fuentes y su POM con las
      # dependencias entre módulos ya resueltas.
      - name: Publicar los módulos en GitHub Packages
        run: ./gradlew publish -PprintscriptVersion=$VERSION --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validar-publicacion:
    name: TCK contra GitHub Packages en un runner nuevo
    needs: publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publicar.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Validar la versión descargada del registro
        env:
          VERSION: ${{ needs.publicar.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tck/run-official-tck.sh "$VERSION" --published
      - name: Guardar el resultado del TCK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tck-paquetes-publicados
          path: build/official-tck/build/reports/tests/test

  release:
    name: Crear Release de la CLI validada
    if: github.event_name == 'push'
    needs: [publicar, validar-publicacion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.publicar.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publicar.outputs.commit }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Armar la distribución
        run: ./gradlew :cli:distZip :cli:distTar -PprintscriptVersion="$VERSION" --no-daemon
      - name: Publicar el Release con el ejecutable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notas.tpl <<'NOTAS'
          ## Requisitos

          Java 25 o superior. Los módulos se compilan con el toolchain declarado en
          `printscript.java-library`, así que un JRE anterior falla con
          `UnsupportedClassVersionError`.

          ## Usar la CLI

          ```sh
          unzip printscript-__VERSION__.zip
          ./printscript-__VERSION__/bin/printscript execution programa.ps
          ./printscript-__VERSION__/bin/printscript validate  programa.ps
          ```

          Sin argumentos entra en modo interactivo y lee de stdin.

          ## Usar los módulos como librería

          ```kotlin
          repositories {
              maven("https://maven.pkg.github.com/ingsis-ua/ingsis-interpreter")
          }
          dependencies {
              implementation("org.printscript:runner:__VERSION__")
          }
          ```
          NOTAS
          sed "s/__VERSION__/$VERSION/g" notas.tpl > notas.md
          gh release create "$GITHUB_REF_NAME" \
            "cli/build/distributions/printscript-$VERSION.zip" \
            "cli/build/distributions/printscript-$VERSION.tar" \
            --title "PrintScript $VERSION" \
            --notes-file notas.md
