name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, chequeos y tests
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 trae la historia completa. El ratchet de Spotless compara
      # contra origin/master para saber qué archivos cambiaron, y con el clon
      # superficial que hace el checkout por defecto esa referencia no existe.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Maven usa coordenadas como org.printscript:runner, pero la API de Packages
      # asigna su propio nombre al paquete. Se consultan esos nombres en vez de
      # duplicar una convención que GitHub no garantiza.
      - name: Identificar los paquetes Maven vinculados
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages?package_type=maven&per_page=100" |
            jq -r --arg repository "$GITHUB_REPOSITORY" \
              '.[] | select(.repository.full_name == $repository) | .name'

      # El toolchain que compila el proyecto está declarado en el convention plugin
      # (Java 25). Lo instalamos acá para que Gradle lo encuentre local en vez de
      # descargarlo en cada corrida. Quien desarrolla no necesita tenerlo: el
      # foojay-resolver de settings.gradle.kts lo resuelve solo.
      - name: Instalar el JDK del toolchain declarado
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build de los trece módulos
        run: ./gradlew build jacocoRootReport --no-daemon --warning-mode all

      - name: Derivar versión trazable del commit
        run: echo "PACKAGE_VERSION=0.2.0-ci.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Ejecutar el TCK oficial contra este commit
        run: ./tck/run-official-tck.sh "$PACKAGE_VERSION"

      # Los PR de forks no reciben un token con escritura. En push, en cambio, este
      # paso publica los mismos jars que acaba de consumir el TCK.
      - name: Publicar snapshot del commit en GitHub Packages
        if: github.event_name == 'push'
        run: ./gradlew publish -PprintscriptVersion="$PACKAGE_VERSION" --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar los reportes de test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-test
          path: '*/build/reports/tests/test'
          if-no-files-found: ignore

      - name: Publicar los reportes de Checkstyle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-checkstyle
          path: '*/build/reports/checkstyle'
          if-no-files-found: ignore

      - name: Publicar los reportes de PMD
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pmd
          path: '*/build/reports/pmd'
          if-no-files-found: ignore

      - name: Publicar el reporte de CPD
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-de-cpd
          path: 'build/reports/cpd'
          if-no-files-found: ignore

      - name: Publicar la cobertura por módulo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-por-modulo
          path: '*/build/reports/jacoco'
          if-no-files-found: ignore

      - name: Publicar la cobertura agregada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-agregada
          path: 'build/reports/jacoco/jacocoRootReport'
          if-no-files-found: ignore
